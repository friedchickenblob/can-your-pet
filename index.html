<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Can Your Pet</title>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  <link rel="icon" href="assets/favicon/favicon.ico">
  <link rel="manifest" href="assets/favicon/site.webmanifest">
  <style>
    :root {
      --bg: #ffe4ec;
      --panel: #ffd0de;
      --active: #ffb6cc;
      --text: #000;
      --pet-h: 60vh;
      --pad-r: 160px;
      --pad-b: 0px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }
    nav {
      width: 15%;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 16px;
    }
    nav button {
      width: 80%;
      padding: 18px 4px;
      font: inherit;
      font-size: clamp(0.75rem, 1.1vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text);
      background: transparent;
      border: 2px solid var(--text);
      border-radius: 12px;
      cursor: pointer;
    }
    nav button:hover { background: var(--active); }
    nav button[aria-selected="true"] { background: var(--active); }
    main {
      width: 85%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    section { display: none; }
    section.active { display: block; }
    h1 { font-size: 2.5rem; margin: 0; }
    .scene.active { display: flex; position: relative; width: 100%; height: 100%; }
    .stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
      position: relative;
      padding: 0 var(--pad-r) var(--pad-b) 0;
    }
    #export {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 12px;
      white-space: nowrap;
      padding: 10px 20px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: transparent;
      border: 2px solid var(--text);
      border-radius: 12px;
      cursor: pointer;
    }
    #export:hover { background: var(--active); }
    .pet { position: relative; z-index: 1; height: var(--pet-h); aspect-ratio: 433 / 461; }
    .pet img { position: absolute; inset: 0; width: 100%; height: 100%; }
    #wornBox { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; touch-action: none; }
    #wornBox img { inset: auto; left: 0; top: 0; cursor: grab; user-select: none; -webkit-user-drag: none; }
    #wornBox img:hover { filter: brightness(1.2); }
    #wornBox.selected img { filter: none; cursor: grabbing; }
    #wornBox .tint { position: absolute; inset: 0; display: none; pointer-events: none;
      background: rgba(255, 0, 0, 0.4);
      -webkit-mask: var(--mask) center / 100% 100% no-repeat; mask: var(--mask) center / 100% 100% no-repeat; }
    #wornBox.selected .tint { display: block; }
    #wornBox .handle { position: absolute; width: 14px; height: 14px; margin: -7px; display: none;
      background: #fff; border: 2px solid #d00; border-radius: 3px; }
    #wornBox.selected .handle { display: block; }
    .handle[data-c="nw"] { left: 0; top: 0; cursor: nwse-resize; }
    .handle[data-c="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
    .handle[data-c="sw"] { left: 0; top: 100%; cursor: nesw-resize; }
    .handle[data-c="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
    .options {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding-right: 16px;
    }
    .options button {
      width: 120px;
      height: 120px;
      padding: 4px;
      background: transparent;
      border: 2px solid var(--text);
      border-radius: 12px;
      cursor: pointer;
    }
    .options button:hover, .options button.on { background: var(--active); }
    .options button img, .options button svg { width: 100%; height: 100%; object-fit: contain; }
    .options button:disabled { opacity: 0.5; cursor: default; }

    /* shower */
    .faucet { position: absolute; left: 20%; bottom: 106%; width: 60%; height: auto; pointer-events: none; }
    .lever { position: absolute; left: 102%; top: 40%; width: 22%; aspect-ratio: 1; padding: 0;
      background: none; border: 0; cursor: pointer; }
    .lever svg { width: 100%; height: 100%; }
    .lever .bar { transform-origin: 50px 50px; transition: transform 0.25s; }
    .lever.on .bar { transform: rotate(75deg); }
    .water { display: none; position: absolute; left: 0; right: 0; top: -4%; bottom: 0; pointer-events: none; overflow: hidden; }
    .running .water { display: block; }
    .drop { position: absolute; top: 0; width: 2.5%; height: 6%; border-radius: 50%;
      background: #4db8ff; opacity: 0.8; animation: fall 0.7s linear infinite; }
    @keyframes fall { from { transform: translateY(0); opacity: 0.9; } to { transform: translateY(1500%); opacity: 0.2; } }
    .running .chick { animation: wiggle 0.35s ease-in-out infinite; }
    @keyframes wiggle { 50% { transform: rotate(1.5deg) scale(1.01); } }

    /* food */
    .food { position: absolute; width: 22%; aspect-ratio: 1; pointer-events: none; }
    .food svg { width: 100%; height: 100%; }


    /* ride bike: far layers crawl, near layers rush past */
    #bike { overflow: hidden; }
    #bike .stage { --g: calc(50% - var(--pad-b) / 2 + var(--pet-h) * 0.71); }
    .layer { position: absolute; left: 0; right: 0; pointer-events: none; background-repeat: repeat-x;
      background-size: var(--w) 100%; animation: scroll var(--t) linear infinite; }
    @keyframes scroll { to { background-position-x: calc(var(--w) * -1); } }
    .sky { position: absolute; inset: 0; background: linear-gradient(#8fd3ff, #e6f6ff 60%); }
    .sun { position: absolute; top: 8%; right: 10%; width: 70px; height: 70px; border-radius: 50%; background: #ffd84d; }
    .clouds { top: 6%; height: 120px; --w: 700px; --t: 58s; background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20700%20120%22%20width%3D%22700%22%20height%3D%22120%22%20%3E%3Cg%20fill%3D%22%23fff%22%20opacity%3D%22.9%22%3E%3Cellipse%20cx%3D%22100%22%20cy%3D%2260%22%20rx%3D%2250%22%20ry%3D%2220%22/%3E%3Cellipse%20cx%3D%22135%22%20cy%3D%2248%22%20rx%3D%2235%22%20ry%3D%2220%22/%3E%3Cellipse%20cx%3D%22420%22%20cy%3D%2240%22%20rx%3D%2260%22%20ry%3D%2222%22/%3E%3Cellipse%20cx%3D%22470%22%20cy%3D%2230%22%20rx%3D%2235%22%20ry%3D%2218%22/%3E%3Cellipse%20cx%3D%22600%22%20cy%3D%2285%22%20rx%3D%2245%22%20ry%3D%2216%22/%3E%3C/g%3E%3C/svg%3E"); }
    .hills { top: calc(var(--g) - 180px); height: 180px; --w: 800px; --t: 32s; background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20800%20180%22%20width%3D%22800%22%20height%3D%22180%22%20%3E%3Cpath%20d%3D%22M0%20180V110Q100%2030%20200%20100T400%20100T600%2090T800%20110V180Z%22%20fill%3D%22%23a9d6b8%22/%3E%3Cpath%20d%3D%22M0%20180V140Q150%2090%20300%20135T600%20130T800%20140V180Z%22%20fill%3D%22%238ac79d%22/%3E%3C/svg%3E"); }
    .trees { top: calc(var(--g) - 150px); height: 140px; --w: 500px; --t: 5.6s; background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20500%20140%22%20width%3D%22500%22%20height%3D%22140%22%20%3E%3Cg%3E%3Crect%20x%3D%2260%22%20y%3D%22100%22%20width%3D%2210%22%20height%3D%2240%22%20fill%3D%22%238a5a2b%22/%3E%3Ccircle%20cx%3D%2265%22%20cy%3D%2278%22%20r%3D%2234%22%20fill%3D%22%233f9a4f%22/%3E%3Crect%20x%3D%22228%22%20y%3D%22108%22%20width%3D%228%22%20height%3D%2232%22%20fill%3D%22%238a5a2b%22/%3E%3Ccircle%20cx%3D%22232%22%20cy%3D%2292%22%20r%3D%2226%22%20fill%3D%22%234cae5c%22/%3E%3Crect%20x%3D%22396%22%20y%3D%2298%22%20width%3D%2210%22%20height%3D%2242%22%20fill%3D%22%238a5a2b%22/%3E%3Ccircle%20cx%3D%22401%22%20cy%3D%2274%22%20r%3D%2236%22%20fill%3D%22%233f9a4f%22/%3E%3C/g%3E%3C/svg%3E"); }
    .grass { top: calc(var(--g) - 12px); bottom: 0; background: #7ccf6a; animation: none; }
    .road { top: calc(var(--g) - 12px); height: 50px; --w: 120px; --t: 0.33s; background-color: #6b6b73; background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%2050%22%20width%3D%22120%22%20height%3D%2250%22%20%3E%3Crect%20x%3D%2230%22%20y%3D%2222%22%20width%3D%2260%22%20height%3D%225%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E"); }
    .tufts { top: calc(var(--g) + 50px); height: 70px; --w: 300px; --t: 0.7s; background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20300%2070%22%20width%3D%22300%22%20height%3D%2270%22%20%3E%3Cg%20fill%3D%22%232f8a3f%22%3E%3Cpath%20d%3D%22M20%2070L26%2020L32%2070Z%22/%3E%3Cpath%20d%3D%22M30%2070L44%2030L50%2070Z%22/%3E%3Cpath%20d%3D%22M130%2070L138%2015L146%2070Z%22/%3E%3Cpath%20d%3D%22M142%2070L158%2035L164%2070Z%22/%3E%3Cpath%20d%3D%22M230%2070L236%2025L244%2070Z%22/%3E%3Cpath%20d%3D%22M242%2070L256%2038L262%2070Z%22/%3E%3C/g%3E%3C/svg%3E"); z-index: 2; }
    .wind { top: calc(var(--g) - var(--pet-h) * 1.1); height: var(--pet-h); --w: 400px; --t: 0.45s; background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20400%20100%22%20width%3D%22400%22%20height%3D%22100%22%20preserveAspectRatio%3D%22none%22%3E%3Cg%20fill%3D%22%23fff%22%20opacity%3D%22.8%22%3E%3Crect%20x%3D%2220%22%20y%3D%2215%22%20width%3D%22120%22%20height%3D%22.7%22%20rx%3D%22.35%22/%3E%3Crect%20x%3D%22200%22%20y%3D%2240%22%20width%3D%22160%22%20height%3D%22.7%22%20rx%3D%22.35%22/%3E%3Crect%20x%3D%2260%22%20y%3D%2265%22%20width%3D%22100%22%20height%3D%22.7%22%20rx%3D%22.35%22/%3E%3Crect%20x%3D%22280%22%20y%3D%2285%22%20width%3D%2290%22%20height%3D%22.7%22%20rx%3D%22.35%22/%3E%3C/g%3E%3C/svg%3E"); z-index: 2; }
    .bike, .bike-front { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
    .crank { transform-box: fill-box; transform-origin: center; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .riding .chick { animation: bob 0.45s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-1.2%); } }

    @media (pointer: coarse) {
      #wornBox .handle { width: 26px; height: 26px; margin: -13px; }
    }
    @media (max-width: 700px) {
      :root { --pet-h: 34vh; --pad-r: 0px; --pad-b: 88px; }
      body { flex-direction: column; }
      nav { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 8px; }
      nav button { width: auto; padding: 8px 10px; font-size: 0.75rem; }
      main { width: 100%; flex: 1; min-height: 0; }
      .options { top: auto; left: 0; width: auto; height: 88px; flex-direction: row; flex-wrap: wrap; padding: 8px; gap: 8px; }
      .options button { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>
  <nav role="tablist">
    <button role="tab" data-tab="home" aria-selected="true">HOME</button>
    <button role="tab" data-tab="dress" aria-selected="false">DRESS UP</button>
    <button role="tab" data-tab="shower" aria-selected="false">SHOWER</button>
    <button role="tab" data-tab="food" aria-selected="false">EAT</button>
    <button role="tab" data-tab="bike" aria-selected="false">RIDE BIKE</button>
  </nav>
  <main>
    <section id="home" class="active"><h1>HOME</h1></section>
    <section id="dress" class="scene">
      <div class="stage">
        <div class="pet">
          <button id="export">EXPORT PNG</button>
          <img id="chicken" src="assets/chicken.png" alt="Chicken">
          <div id="wornBox">
            <img id="worn" alt="Dress" draggable="false">
            <div class="tint"></div>
            <span class="handle" data-c="nw"></span><span class="handle" data-c="ne"></span>
            <span class="handle" data-c="sw"></span><span class="handle" data-c="se"></span>
          </div>
        </div>
      </div>
      <div class="options">
        <button data-dress="assets/dress-pink.png" aria-label="Pink dress"><img src="assets/dress-pink.png" alt=""></button>
        <button data-dress="assets/dress-blue.png" aria-label="Blue dress"><img src="assets/dress-blue.png" alt=""></button>
        <button data-dress="assets/dress-purple.png" aria-label="Purple dress"><img src="assets/dress-purple.png" alt=""></button>
        <button id="trash" aria-label="Remove dress"><img src="assets/trash.png" alt=""></button>
      </div>
    </section>
    <section id="shower" class="scene">
      <div class="stage shower-stage">
        <div class="pet" id="showerPet">
          <svg class="faucet" viewBox="0 0 200 80"><rect x="90" y="0" width="20" height="30" fill="#9aa5b1"/><rect x="70" y="26" width="60" height="14" rx="5" fill="#7d8996"/><path d="M60 42h80l30 34H30z" fill="#b8c2cc" stroke="#7d8996" stroke-width="3" stroke-linejoin="round"/><g fill="#7d8996"><circle cx="60" cy="66" r="3"/><circle cx="80" cy="66" r="3"/><circle cx="100" cy="66" r="3"/><circle cx="120" cy="66" r="3"/><circle cx="140" cy="66" r="3"/></g></svg>
          <img class="chick" src="assets/chicken.png" alt="Chicken">
          <div class="water"></div>
          <button class="lever" id="lever" aria-label="Toggle water" aria-pressed="false"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#b8c2cc" stroke="#7d8996" stroke-width="5"/><g class="bar"><rect x="46" y="6" width="8" height="46" rx="4" fill="#e63946" stroke="#000" stroke-width="2"/><circle cx="50" cy="8" r="8" fill="#e63946" stroke="#000" stroke-width="2"/></g><circle cx="50" cy="50" r="8" fill="#7d8996"/></svg></button>
        </div>
      </div>
    </section>
    <section id="food" class="scene">
      <div class="stage">
        <div class="pet" id="foodPet">
          <img class="chick" src="assets/chicken.png" alt="Chicken">
        </div>
      </div>
      <div class="options">
        <button data-food="carrot" aria-label="Carrot"><svg viewBox="0 0 100 100"><path d="M58 30c-6-14 0-22 8-24 0 8 4 12 2 24z" fill="#3fa34d"/><path d="M62 32c8-12 18-14 26-10-4 8-12 14-22 16z" fill="#4cbb5a"/><path d="M38 36c14-10 32-4 30 14L16 90C10 70 20 48 38 36z" fill="#ff8a1f"/><path d="M40 52l10 2M32 66l10 2M48 42l8 3" stroke="#d96a00" stroke-width="3" stroke-linecap="round"/></svg></button>
        <button data-food="drumstick" aria-label="Chicken drumstick"><svg viewBox="0 0 100 100"><path d="M44 62L20 84" stroke="#f5ecd8" stroke-width="9" stroke-linecap="round"/><circle cx="14" cy="80" r="7" fill="#f5ecd8"/><circle cx="22" cy="90" r="7" fill="#f5ecd8"/><ellipse cx="62" cy="38" rx="30" ry="24" fill="#c8641e" transform="rotate(-40 62 38)"/><ellipse cx="56" cy="30" rx="14" ry="8" fill="#e0853a" transform="rotate(-40 56 30)"/></svg></button>
        <button data-food="pizza" aria-label="Pizza"><svg viewBox="0 0 100 100"><path d="M50 94L10 24Q50 8 90 24z" fill="#ffc94d" stroke="#e8a33a" stroke-width="3" stroke-linejoin="round"/><path d="M10 24Q50 8 90 24" fill="none" stroke="#d98b3a" stroke-width="9" stroke-linecap="round"/><circle cx="36" cy="36" r="7" fill="#d62828"/><circle cx="62" cy="38" r="7" fill="#d62828"/><circle cx="50" cy="60" r="7" fill="#d62828"/></svg></button>
      </div>
    </section>
    <section id="bike" class="scene">
      <div class="stage">
        <div class="sky"></div><div class="sun"></div>
        <div class="layer clouds"></div><div class="layer hills"></div><div class="layer trees"></div>
        <div class="layer grass"></div><div class="layer road"></div>
        <div class="pet riding">
          <svg class="bike" viewBox="0 0 433 461" aria-hidden="true">
            <g transform="translate(90 505)"><circle r="55" fill="none" stroke="#222" stroke-width="8"/><g class="wheel"><path d="M-55 0H55M0 -55V55M-39 -39L39 39M-39 39L39 -39" stroke="#888" stroke-width="2"/></g></g><g transform="translate(340 505)"><circle r="55" fill="none" stroke="#222" stroke-width="8"/><g class="wheel"><path d="M-55 0H55M0 -55V55M-39 -39L39 39M-39 39L39 -39" stroke="#888" stroke-width="2"/></g></g>
            <g stroke="#e63946" stroke-width="8" stroke-linecap="round" fill="none">
              <path d="M90 505L200 500L185 445L90 505M185 445L318 445L200 500M318 445L340 505"/>
            </g>
            <path d="M160 440H215" stroke="#222" stroke-width="10" stroke-linecap="round"/>
            <circle cx="200" cy="500" r="16" fill="none" stroke="#444" stroke-width="5"/>
            <g class="crank"><path d="M200 484V516" stroke="#444" stroke-width="5"/><rect x="190" y="480" width="20" height="6" fill="#222"/></g>
          </svg>
          <img class="chick" src="assets/chicken.png" alt="Chicken">
          <svg class="bike-front" viewBox="0 0 433 461" aria-hidden="true">
            <path d="M318 445L336 395L362 388" stroke="#e63946" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M356 388H372" stroke="#222" stroke-width="10" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="layer tufts"></div><div class="layer wind"></div>
      </div>
    </section>
  </main>
  <script>
    const tabs = document.querySelectorAll('nav button');
    const panels = document.querySelectorAll('section');
    tabs.forEach(tab => tab.addEventListener('click', () => {
      tabs.forEach(t => t.setAttribute('aria-selected', t === tab));
      panels.forEach(p => p.classList.toggle('active', p.id === tab.dataset.tab));
    }));

    const pet = document.querySelector('.pet');
    const box = document.getElementById('wornBox');
    const worn = document.getElementById('worn');
    const tint = box.querySelector('.tint');
    const dressBtns = document.querySelectorAll('[data-dress]');
    const MIN = 30;
    let current = null;

    function setBox(x, y, w, h) {
      const r = pet.getBoundingClientRect();
      Object.assign(box.style, { left: x / r.width * 100 + '%', top: y / r.height * 100 + '%',
        width: w / r.width * 100 + '%', height: h / r.height * 100 + '%' });
    }
    function resetBox() {
      Object.assign(box.style, { left: '0', top: '0', width: '100%', height: '100%' });
    }
    function hideDress() {
      current = null;
      box.style.display = 'none';
      box.classList.remove('selected');
      resetBox();
      dressBtns.forEach(o => o.classList.remove('on'));
    }
    worn.style.width = worn.style.height = '100%';

    dressBtns.forEach(b => b.addEventListener('click', () => {
      if (current === b) return hideDress();
      current = b;
      worn.src = b.dataset.dress;
      tint.style.setProperty('--mask', `url("${b.dataset.dress}")`);
      box.style.display = 'block';
      dressBtns.forEach(o => o.classList.toggle('on', o === b));
    }));
    document.getElementById('trash').addEventListener('click', hideDress);

    // select / move / resize
    let drag = null;
    box.addEventListener('pointerdown', e => {
      e.preventDefault();
      const pr = pet.getBoundingClientRect(), br = box.getBoundingClientRect();
      const rect = { x: br.left - pr.left, y: br.top - pr.top, w: br.width, h: br.height };
      const c = e.target.dataset.c;
      box.classList.add('selected');
      box.setPointerCapture(e.pointerId);
      if (c) {
        drag = { mode: 'resize', c, rect, pr, ratio: rect.w / rect.h,
          ax: c.includes('w') ? rect.x + rect.w : rect.x, ay: c.includes('n') ? rect.y + rect.h : rect.y };
      } else {
        drag = { mode: 'move', rect, pr, sx: e.clientX, sy: e.clientY };
      }
    });
    box.addEventListener('pointermove', e => {
      if (!drag) return;
      const { rect, pr } = drag;
      if (drag.mode === 'move') {
        setBox(rect.x + e.clientX - drag.sx, rect.y + e.clientY - drag.sy, rect.w, rect.h);
      } else {
        const mx = e.clientX - pr.left, my = e.clientY - pr.top;
        // keep aspect ratio: use whichever axis the mouse has moved further along
        const w = Math.max(MIN, Math.abs(mx - drag.ax), Math.abs(my - drag.ay) * drag.ratio);
        const h = w / drag.ratio;
        setBox(drag.c.includes('w') ? drag.ax - w : drag.ax, drag.c.includes('n') ? drag.ay - h : drag.ay, w, h);
      }
    });
    const endDrag = () => { drag = null; };
    box.addEventListener('pointerup', endDrag);
    box.addEventListener('pointercancel', endDrag);
    // export a square PNG: chicken bounds (opaque pixels) plus ~1cm padding all round
    const BODY = { x: 10, y: 21, w: 413, h: 429 }; // opaque bounds inside chicken.png (433x461)
    document.getElementById('export').addEventListener('click', () => {
      const chicken = document.getElementById('chicken');
      const s = pet.getBoundingClientRect().height / chicken.naturalHeight; // display px per image px
      const pad = 96 / 2.54 / s; // 1cm in image px
      const side = Math.round(Math.max(BODY.w, BODY.h) + 2 * pad);
      const ox = BODY.x + BODY.w / 2 - side / 2, oy = BODY.y + BODY.h / 2 - side / 2;
      const cv = document.createElement('canvas');
      cv.width = cv.height = side;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg');
      ctx.fillRect(0, 0, side, side);
      ctx.drawImage(chicken, -ox, -oy);
      if (current) {
        const pr = pet.getBoundingClientRect(), br = box.getBoundingClientRect();
        ctx.drawImage(worn, (br.left - pr.left) / s - ox, (br.top - pr.top) / s - oy, br.width / s, br.height / s);
      }
      cv.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'chicken.png';
        a.click();
        URL.revokeObjectURL(a.href);
      });
    });
    // click anywhere else deselects
    document.addEventListener('pointerdown', e => {
      if (!box.contains(e.target)) box.classList.remove('selected');
    });

    // shower
    const showerPet = document.getElementById('showerPet');
    const lever = document.getElementById('lever');
    const water = showerPet.querySelector('.water');
    for (let i = 0; i < 18; i++) {
      const d = document.createElement('span');
      d.className = 'drop';
      d.style.left = 38 + Math.random() * 24 + '%';
      d.style.animationDelay = -Math.random() * 0.7 + 's';
      water.appendChild(d);
    }
    lever.addEventListener('click', () => {
      const on = showerPet.classList.toggle('running');
      lever.classList.toggle('on', on);
      lever.setAttribute('aria-pressed', on);
    });

    // food: fly to the beak, get bitten away
    const foodPet = document.getElementById('foodPet');
    const foodBtns = document.querySelectorAll('[data-food]');
    const MOUTH = { x: 52, y: 36 }; // % of the pet, just in front of the beak
    foodBtns.forEach(b => b.addEventListener('click', async () => {
      foodBtns.forEach(o => o.disabled = true);
      const f = document.createElement('div');
      f.className = 'food';
      f.innerHTML = b.innerHTML;
      foodPet.appendChild(f);
      const at = (x, y, sc, rot) => ({ left: x + '%', top: y + '%',
        transform: `translate(-50%, -50%) scale(${sc}) rotate(${rot}deg)` });
      const anim = f.animate([
        at(95, 85, 1, 25), at(MOUTH.x, MOUTH.y, 1, -10),
        at(MOUTH.x, MOUTH.y, 0.75, -10), at(MOUTH.x, MOUTH.y, 0.5, -10),
        at(MOUTH.x, MOUTH.y, 0.25, -10), at(MOUTH.x, MOUTH.y, 0, -10)
      ], { duration: 2000, easing: 'ease-in-out', fill: 'forwards' });
      foodPet.querySelector('.chick').animate(
        [{ transform: 'none' }, { transform: 'scale(1.03, 0.95)' }, { transform: 'none' }],
        { duration: 220, delay: 700, iterations: 4 });
      await anim.finished;
      f.remove();
      foodBtns.forEach(o => o.disabled = false);
    }));
  </script>
</body>
</html>
